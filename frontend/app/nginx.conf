server {
    listen 80;
    server_name localhost;

    # Allow larger payloads for audio recordings and resume uploads
    client_max_body_size 50M;

    # Enable Gzip compression for static Vite assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Explicit endpoints for Googlebot and SEO crawlers
    location = /sitemap.xml {
        root /usr/share/nginx/html;
        default_type application/xml;
    }

    location = /robots.txt {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    # Serve static assets generated by Vite
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Enable React Router client-side SPA routing fallback
        try_files $uri $uri/ /index.html;
    }

    # Security Response Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reverse proxy backend API endpoints to FastAPI container
    # Includes SSE streaming support, websockets, and long AI inference timeouts
    location ~ ^/(api|auth|sessions|feedback|stats|answers|user|resume|assessment|certificates|system-design|leaderboard|linkedin) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI & Streaming optimizations
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
