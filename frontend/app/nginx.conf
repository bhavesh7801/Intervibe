server {
    listen 80;
    server_name localhost;

    # Explicit endpoints for Googlebot and SEO crawlers
    location = /sitemap.xml {
        root /usr/share/nginx/html;
        default_type application/xml;
    }

    location = /robots.txt {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    # Serve static assets generated by Vite
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Enable React Router client-side SPA routing fallback
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy backend API endpoints to FastAPI container
    location ~ ^/(api|auth|sessions|feedback|stats|answers|user|resume|assessment) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
