<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="fav-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="fav-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BE123C" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Glow / Halo -->
  <path d="M 50,2 L 69,31 L 98,50 L 69,69 L 50,98 L 31,69 L 2,50 L 31,31 Z" fill="url(#fav-grad-1)" opacity="0.35" filter="url(#fav-glow)" />

  <!-- Outer Intervibe Diamond Star -->
  <path d="M 50,5 L 68,32 L 95,50 L 68,68 L 50,95 L 32,68 L 5,50 L 32,32 Z" fill="url(#fav-grad-1)" />
  
  <!-- Inner Star Layer -->
  <path d="M 50,18 L 62,38 L 82,50 L 62,62 L 50,82 L 38,62 L 18,50 L 38,38 Z" fill="url(#fav-grad-2)" opacity="0.9" />
  
  <!-- Center Core Star -->
  <path d="M 50,28 L 56,44 L 72,50 L 56,56 L 50,72 L 44,56 L 28,50 L 44,44 Z" fill="#FFFFFF" />
</svg>
