services:
  # 1. FastAPI Python Backend Service
  backend:
    image: ghcr.io/bhavesh7801/intervibe/backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interview_prep_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 2. React + Vite Nginx Frontend Service
  frontend:
    image: ghcr.io/bhavesh7801/intervibe/frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=
        - VITE_GOOGLE_CLIENT_ID=658426092732-l6odo2d5esndtljmu4brsvu31f3lp9kk.apps.googleusercontent.com
    container_name: interview_prep_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - app-network

# Shared Internal Container Network
networks:
  app-network:
    driver: bridge
